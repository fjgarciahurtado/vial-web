# Netlify settings for vial-web. Connecting the repository in Netlify is enough:
# everything below is read from this file. See docs/DEPLOY.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+.
  NODE_VERSION = "22"
  # Playwright is only needed for local tests; don't download browsers on Netlify.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Pull requests get a preview site built the same way, so changes can be tried
# on a real keyboard before merging.
[context.deploy-preview]
  command = "npm run build"

# The app has a single page; send any unknown path to it instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Only this site may use WebHID; nothing else powerful is needed.
    Permissions-Policy = "hid=(self), camera=(), microphone=(), geolocation=(), usb=(), serial=()"
    # Everything is served from this site, with no inline scripts or styles. React
    # sets element styles through the DOM, which this policy allows. Checked by
    # replaying the app under this exact header (see docs/DEPLOY.md).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Built files have a content hash in their name, so they never change: cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The page itself must always be fresh, so new releases reach people straight away.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
